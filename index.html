<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Quests RPG v5.3</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for React & Icons -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>

    <style>
        body { background-color: #020617; } /* slate-950 */
        body { overscroll-behavior-y: none; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes pulse-emerald {
            0%, 100% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        }
        .completion-glow {
            animation: pulse-emerald 2s infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Sword, Shield, Scroll, Trophy, Save, Calendar, BarChart2, 
            Target, User, Zap, MessageSquare, Share2, Send, PenTool, 
            Download, ChevronLeft, ChevronRight, Flame, Trash2, Crown, 
            TrendingUp, Lock, CheckCircle, Heart, Video, Users, BookOpen,
            Palette, Briefcase, CheckSquare, Dumbbell
        } from 'lucide-react';

        // --- Constants ---
        const STORAGE_KEY = 'daily_quests_v5_local';

        // Helper to get local date string (YYYY-MM-DD) instead of UTC
        const getLocalDate = () => {
            const d = new Date();
            const offset = d.getTimezoneOffset() * 60000;
            return new Date(d.getTime() - offset).toISOString().split('T')[0];
        };

        const INITIAL_LOG = {
            date: getLocalDate(),
            // Charisma Inputs
            replyGuy: 0,
            icpComments: 0,
            hvInteractions: 0,
            outboundDMs: 0,
            // Fitness Input
            cardioMinutes: 0,
            // Intellect Inputs
            regularPosts: 0,
            collabPosts: 0,
            researchThreads: 0,
            // Creativity Input
            ytShorts: 0,
            // Admin
            weeklyTracker: false,
            // Meta
            xp: 0,
        };

        const TARGETS = {
            replyGuy: 13,
            icpComments: 3,
            hvInteractions: 3,
            outboundDMs: 2,
            cardioMinutes: 30,
        };

        const XP_VALUES = {
            replyGuy: 15,
            icpComments: 60,
            hvInteractions: 75,
            outboundDMs: 100,
            regularPosts: 300,
            collabPosts: 500,
            researchThreads: 800,
            ytShorts: 200,
            cardioMinutes: 10,
            weeklyTracker: 250,
            perfectDay: 500 
        };

        const PERKS = {
            Charisma: [
                { lvl: 1, name: "Lurker", desc: "You exist." },
                { lvl: 5, name: "Reply Guy", desc: "First on the scene." },
                { lvl: 15, name: "Networker", desc: "People recognize your pfp." },
                { lvl: 30, name: "Cult Leader", desc: "They wait for your comments." }
            ],
            Intellect: [
                { lvl: 1, name: "Scribe", desc: "Writing words." },
                { lvl: 5, name: "Strategist", desc: "Content with purpose." },
                { lvl: 15, name: "Thought Leader", desc: "Threads that convert." },
                { lvl: 30, name: "Sage", desc: "Your word is law." }
            ],
            Fitness: [
                { lvl: 1, name: "Walker", desc: "Touching grass." },
                { lvl: 5, name: "Runner", desc: "Heart rate up." },
                { lvl: 15, name: "Athlete", desc: "Consistent engine." },
                { lvl: 30, name: "Iron Lung", desc: "Unstoppable stamina." }
            ],
            Creativity: [ 
                { lvl: 1, name: "Clipper", desc: "Reposting content." },
                { lvl: 5, name: "Editor", desc: "Adding some flair." },
                { lvl: 15, name: "Director", desc: "Visual storytelling." },
                { lvl: 30, name: "Viral God", desc: "Algorithm whisperer." }
            ],
            WorkEthic: [ 
                { lvl: 1, name: "Novice", desc: "Trying hard." },
                { lvl: 5, name: "Grinder", desc: "Showing up daily." },
                { lvl: 15, name: "Professional", desc: "No excuses." },
                { lvl: 30, name: "The Machine", desc: "Perfect consistency." }
            ]
        };

        // --- Helper Components ---

        const SvgRadarChart = ({ stats }) => {
            const size = 220;
            const center = size / 2;
            const radius = 80;
            const labels = ["CHARISMA", "INTELLECT", "FITNESS", "CREATIVITY", "ETHIC"];
            const keys = ["Charisma", "Intellect", "Fitness", "Creativity", "WorkEthic"];
            
            const getCoordinates = (value, index, total) => {
                const angle = (Math.PI * 2 * index) / total - Math.PI / 2;
                const r = (value / 100) * radius;
                return `${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`;
            };

            const points = keys.map((key, i) => getCoordinates(stats[key], i, 5)).join(' ');
            const bgPoints = keys.map((_, i) => getCoordinates(100, i, 5)).join(' ');
            const midPoints = keys.map((_, i) => getCoordinates(50, i, 5)).join(' ');

            const labelCoords = keys.map((_, i) => {
                const angle = (Math.PI * 2 * i) / 5 - Math.PI / 2;
                const r = radius + 20;
                return {
                    x: center + r * Math.cos(angle),
                    y: center + r * Math.sin(angle)
                };
            });

            return (
                <svg width="100%" height="250" viewBox={`0 0 ${size} ${size}`}>
                    <polygon points={bgPoints} fill="none" stroke="#334155" strokeWidth="1" />
                    <polygon points={midPoints} fill="none" stroke="#334155" strokeWidth="0.5" strokeDasharray="4 4" />
                    {keys.map((_, i) => {
                        const end = getCoordinates(100, i, 5).split(',');
                        return <line key={i} x1={center} y1={center} x2={end[0]} y2={end[1]} stroke="#334155" strokeWidth="0.5" />;
                    })}
                    {labelCoords.map((coord, i) => (
                        <text key={i} x={coord.x} y={coord.y} textAnchor="middle" dominantBaseline="middle" 
                            fill={["#34d399", "#60a5fa", "#f43f5e", "#a78bfa", "#fbbf24"][i]} 
                            fontSize="9" fontWeight="bold">
                            {labels[i]}
                        </text>
                    ))}
                    <polygon points={points} fill="rgba(99, 102, 241, 0.4)" stroke="#818cf8" strokeWidth="2" />
                </svg>
            );
        };

        const ProgressBar = ({ current, max, color = "bg-blue-500", size = "h-3" }) => {
            const percent = Math.min(100, (current / max) * 100);
            return (
                <div className={`w-full bg-slate-800 rounded-full ${size} overflow-hidden`}>
                    <div className={`h-full ${color} transition-all duration-500 ease-out`} style={{ width: `${percent}%` }} />
                </div>
            );
        };

        const NumberInput = ({ label, value, onChange, target, icon: Icon, step = 1 }) => {
            const isComplete = value >= target;
            return (
                <div className={`p-4 rounded-xl border transition-all duration-300 ${isComplete ? 'bg-emerald-900/10 border-emerald-500/30' : 'bg-slate-800 border-slate-700'}`}>
                    <div className="flex justify-between items-center mb-2">
                        <div className="flex items-center space-x-3">
                            <Icon className={`w-5 h-5 ${isComplete ? 'text-emerald-400' : 'text-slate-400'}`} />
                            <span className={`font-medium ${isComplete ? 'text-emerald-200' : 'text-slate-200'}`}>{label}</span>
                        </div>
                        <div className="text-sm font-mono text-slate-400">
                            <span className={isComplete ? 'text-emerald-400 font-bold' : 'text-white'}>{value}</span>
                            <span className="text-slate-600"> / {target}</span>
                        </div>
                    </div>
                    <ProgressBar current={value} max={target} color={isComplete ? "bg-emerald-500" : "bg-indigo-500"} size="h-2" />
                    <div className="flex space-x-2 mt-3">
                        <button onClick={() => onChange(Math.max(0, value - step))} className="w-10 h-9 flex items-center justify-center rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 active:bg-slate-800">-</button>
                        <button onClick={() => onChange(value + step)} className={`flex-1 h-9 flex items-center justify-center rounded-lg font-bold text-sm transition-colors active:scale-95 ${isComplete ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}>+ Log</button>
                    </div>
                </div>
            );
        };

        // --- Main App ---

        function DailyQuestTracker() {
            const [activeTab, setActiveTab] = useState('quest');
            const [currentDate, setCurrentDate] = useState(getLocalDate());
            const [log, setLog] = useState(INITIAL_LOG);
            const [history, setHistory] = useState([]);

            // Load History
            useEffect(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsedHistory = JSON.parse(saved);
                        setHistory(parsedHistory);
                        const todayEntry = parsedHistory.find(h => h.date === currentDate);
                        setLog(todayEntry || { ...INITIAL_LOG, date: currentDate });
                    }
                } catch (e) { console.error("Load failed", e); }
            }, []);

            // Sync Log on Date Change
            useEffect(() => {
                const entry = history.find(h => h.date === currentDate);
                setLog(entry || { ...INITIAL_LOG, date: currentDate });
            }, [currentDate]);

            // --- Business Logic ---

            const getDailyBossRequirements = (dateStr) => {
                const day = new Date(dateStr).getDay(); // 0=Sun, 1=Mon...
                // Mon (1): Collab + 1 Short
                if (day === 0) return { title: "The Challenge", desc: "Post Collab & Short", shorts: 1, collab: 1, thread: 0, reg: 0, tracker: false };
                // Tue (2): Update
                if (day === 1) return { title: "The Challenge", desc: "Post Update", shorts: 0, collab: 0, thread: 0, reg: 1, tracker: false };
                // Wed (3): Thread + 1 Short
                if (day === 2) return { title: "The Challenge", desc: "Research Thread & Short", shorts: 1, collab: 0, thread: 1, reg: 0, tracker: false };
                // Thu (4): Update
                if (day === 3) return { title: "The Challenge", desc: "Post Update", shorts: 0, collab: 0, thread: 0, reg: 1, tracker: false };
                // Fri (5): Update + Short + Tracker
                if (day === 4) return { title: "The Closer", desc: "Update, Short & Tracker", shorts: 1, collab: 0, thread: 0, reg: 1, tracker: true };
                
                return null; // Weekend
            };

            const checkCategoryCompletion = (logData, category) => {
                const reqs = getDailyBossRequirements(logData.date);
                
                if (category === 'fitness') {
                    return logData.cardioMinutes >= TARGETS.cardioMinutes;
                }
                
                if (category === 'youtube') {
                    // Only required on M/W/F (days 1,3,5)
                    const day = new Date(logData.date).getDay();
                    if (day === 1 || day === 3 || day === 5) {
                        return logData.ytShorts >= 1;
                    }
                    return null; // No requirement today
                }

                if (category === 'omni') {
                    // Omni = Basics + Specific Boss Task
                    const basicsMet = 
                        logData.replyGuy >= TARGETS.replyGuy &&
                        logData.icpComments >= TARGETS.icpComments &&
                        logData.hvInteractions >= TARGETS.hvInteractions &&
                        logData.outboundDMs >= TARGETS.outboundDMs;
                    
                    if (!basicsMet) return false;
                    if (!reqs) return true; // Weekend grind only

                    const bossMet = 
                        logData.collabPosts >= reqs.collab &&
                        logData.researchThreads >= reqs.thread &&
                        logData.regularPosts >= reqs.reg &&
                        (reqs.tracker ? logData.weeklyTracker : true);
                    
                    return bossMet;
                }
                return false;
            };

            const saveToLocal = (newLog) => {
                const otherEntries = history.filter(h => h.date !== newLog.date);
                const newHistory = [...otherEntries, newLog].sort((a, b) => b.date.localeCompare(a.date));
                setHistory(newHistory);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(newHistory));
            };

            const handleUpdate = (field, val) => {
                const updatedLog = { ...log, [field]: val };
                
                // Recalculate XP
                const newXp = (updatedLog.replyGuy * XP_VALUES.replyGuy) +
                              (updatedLog.icpComments * XP_VALUES.icpComments) +
                              (updatedLog.hvInteractions * XP_VALUES.hvInteractions) +
                              (updatedLog.outboundDMs * XP_VALUES.outboundDMs) +
                              (updatedLog.regularPosts * XP_VALUES.regularPosts) +
                              (updatedLog.collabPosts * XP_VALUES.collabPosts) +
                              (updatedLog.researchThreads * XP_VALUES.researchThreads) +
                              (updatedLog.ytShorts * XP_VALUES.ytShorts) +
                              (updatedLog.cardioMinutes * XP_VALUES.cardioMinutes) +
                              (updatedLog.weeklyTracker ? XP_VALUES.weeklyTracker : 0);
                
                const finalLog = { ...updatedLog, xp: newXp };
                setLog(finalLog);
                saveToLocal(finalLog);
            };

            // --- Stats & Streaks ---
            
            const calculateStreak = (category) => {
                if (history.length === 0) return 0;
                const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
                let currentStreak = 0;
                let checkDate = new Date();
                const todayStr = getLocalDate(); // Use local date
                
                for (let i = 0; i < 365; i++) {
                    // Safe date string generation manually to ensure local date consistency
                    const offset = checkDate.getTimezoneOffset() * 60000;
                    const dateStr = new Date(checkDate.getTime() - offset).toISOString().split('T')[0];
                    
                    const entry = sorted.find(h => h.date === dateStr);
                    
                    let isDone = false;
                    let isRequired = true;

                    if (entry) {
                        const status = checkCategoryCompletion(entry, category);
                        if (status === null) isRequired = false; // Rest day for this cat
                        else isDone = status;
                    } else {
                        // No entry exists for this day
                        // If it's today, we don't break streak yet
                        if (dateStr === todayStr) {
                             checkDate.setDate(checkDate.getDate() - 1);
                             continue;
                        }
                        // If past day and no entry, assume incomplete if it was a workday
                        const day = new Date(dateStr).getDay();
                        if (category === 'youtube' && (day === 0 || day === 2 || day === 4 || day === 6)) isRequired = false;
                        if (category === 'omni' && (day === 0 || day === 6)) isRequired = false;
                    }

                    if (!isRequired) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        continue;
                    }

                    if (isDone) {
                        currentStreak++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else {
                        // If it's today and simply incomplete, don't break streak, just ignore today
                        if (dateStr === todayStr) {
                             checkDate.setDate(checkDate.getDate() - 1);
                             continue;
                        }
                        break; // Streak broken on past day
                    }
                }
                return currentStreak;
            };

            // Calculate Total YouTube Shorts
            const totalYT = useMemo(() => {
                return history.reduce((acc, curr) => acc + (curr.ytShorts || 0), 0);
            }, [history]);

            const streaks = useMemo(() => ({
                omni: calculateStreak('omni'),
                fitness: calculateStreak('fitness')
            }), [history, log]);

            // Total XP & Level
            const totalXP = useMemo(() => history.reduce((acc, curr) => acc + (curr.xp || 0), 0), [history]);
            const userLevel = Math.floor(totalXP / 3000) + 1;

            // 5-Stat Calculation
            const skillStats = useMemo(() => {
                const stats = { Charisma: 0, Intellect: 0, Fitness: 0, Creativity: 0, WorkEthic: 0 };
                history.forEach(day => {
                    stats.Charisma += (day.replyGuy * 10) + (day.icpComments * 20) + (day.hvInteractions * 30) + (day.outboundDMs * 40);
                    stats.Intellect += (day.regularPosts * 100) + (day.collabPosts * 150) + (day.researchThreads * 200);
                    stats.Fitness += (day.cardioMinutes * 5);
                    stats.Creativity += (day.ytShorts * 100);
                    
                    const omniDone = checkCategoryCompletion(day, 'omni');
                    const fitDone = checkCategoryCompletion(day, 'fitness');
                    const ytDone = checkCategoryCompletion(day, 'youtube');
                    
                    // Perfect day logic: All required tasks done
                    const dayIndex = new Date(day.date).getDay();
                    const omniReq = dayIndex !== 0 && dayIndex !== 6;
                    const ytReq = dayIndex === 1 || dayIndex === 3 || dayIndex === 5;
                    
                    if ((!omniReq || omniDone) && fitDone && (!ytReq || ytDone !== false)) {
                         stats.WorkEthic += XP_VALUES.perfectDay;
                    }
                });
                return stats;
            }, [history]);

            const renderQuestLog = () => {
                const reqs = getDailyBossRequirements(currentDate);

                return (
                    <div className="space-y-5 pb-20 animate-in fade-in slide-in-from-bottom-4 duration-500">
                        {/* Header */}
                        <div className="flex items-center justify-between bg-slate-800 p-3 rounded-xl border border-slate-700">
                            <button onClick={() => {
                                const d = new Date(currentDate); d.setDate(d.getDate() - 1);
                                setCurrentDate(d.toISOString().split('T')[0]);
                            }} className="p-2 text-slate-400 hover:text-white"><ChevronLeft className="w-5 h-5"/></button>
                            <div className="text-center">
                                <div className="text-xs text-slate-500 font-bold uppercase tracking-wider">Quest Log</div>
                                <div className="font-mono text-white flex items-center gap-2"><Calendar className="w-4 h-4 text-indigo-400"/> {currentDate}</div>
                            </div>
                            <button onClick={() => {
                                const d = new Date(currentDate); d.setDate(d.getDate() + 1);
                                setCurrentDate(d.toISOString().split('T')[0]);
                            }} className="p-2 text-slate-400 hover:text-white"><ChevronRight className="w-5 h-5"/></button>
                        </div>

                        {/* 3-Pillar Streaks */}
                        <div className="grid grid-cols-3 gap-2">
                             <div className="bg-slate-800 p-3 rounded-xl border border-blue-500/30 text-center">
                                 <div className="text-[10px] uppercase text-blue-400 font-bold mb-1">OMNI Streak</div>
                                 <div className="text-2xl font-black text-white flex justify-center items-center gap-1">
                                     <Briefcase className="w-4 h-4 text-blue-500"/> {streaks.omni}
                                 </div>
                             </div>
                             <div className="bg-slate-800 p-3 rounded-xl border border-rose-500/30 text-center">
                                 <div className="text-[10px] uppercase text-rose-400 font-bold mb-1">Fit Streak</div>
                                 <div className="text-2xl font-black text-white flex justify-center items-center gap-1">
                                     <Dumbbell className="w-4 h-4 text-rose-500"/> {streaks.fitness}
                                 </div>
                             </div>
                             <div className="bg-slate-800 p-3 rounded-xl border border-purple-500/30 text-center">
                                 <div className="text-[10px] uppercase text-purple-400 font-bold mb-1">YT Posted</div>
                                 <div className="text-2xl font-black text-white flex justify-center items-center gap-1">
                                     <Video className="w-4 h-4 text-purple-500"/> {totalYT}
                                 </div>
                             </div>
                        </div>

                        {/* Cardio - Fitness Base */}
                        <div className="bg-slate-800/50 p-1 rounded-xl">
                            <NumberInput label="Cardio (Mins)" value={log.cardioMinutes} target={TARGETS.cardioMinutes} step={5} onChange={(v) => handleUpdate('cardioMinutes', v)} icon={Heart}/>
                        </div>

                        {/* Boss Section */}
                        {reqs && (
                            <div className="relative bg-slate-900 rounded-xl p-5 border-2 border-red-900/50 shadow-lg">
                                <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-red-600 px-3 py-0.5 rounded-full text-[10px] font-bold uppercase text-white tracking-wider shadow-lg">Daily Boss Fight</div>
                                <div className="text-center mb-4 mt-1">
                                    <h3 className="text-white font-bold text-lg flex items-center justify-center gap-2">
                                        <Sword className="w-5 h-5 text-red-500"/> {reqs.title}
                                    </h3>
                                    <p className="text-slate-400 text-xs">{reqs.desc}</p>
                                </div>
                                
                                <div className="space-y-3">
                                    {reqs.shorts > 0 && (
                                        <button onClick={() => handleUpdate('ytShorts', log.ytShorts < reqs.shorts ? log.ytShorts + 1 : log.ytShorts)} className={`w-full py-3 rounded-lg font-bold flex items-center justify-between px-4 transition-all ${log.ytShorts >= reqs.shorts ? 'bg-purple-500/20 text-purple-200 border border-purple-500' : 'bg-slate-800 text-slate-300 border border-slate-700'}`}>
                                            <span className="flex items-center gap-2"><Video className="w-4 h-4"/> YT Shorts (Creativity)</span>
                                            <span>{log.ytShorts}/{reqs.shorts}</span>
                                        </button>
                                    )}
                                    {reqs.collab > 0 && (
                                        <button onClick={() => handleUpdate('collabPosts', log.collabPosts ? 0 : 1)} className={`w-full py-3 rounded-lg font-bold flex items-center justify-center gap-2 transition-all ${log.collabPosts ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 border border-slate-700'}`}>
                                            <Users className="w-4 h-4"/> {log.collabPosts ? "Collab Posted" : "Publish Collab"}
                                        </button>
                                    )}
                                    {reqs.thread > 0 && (
                                        <button onClick={() => handleUpdate('researchThreads', log.researchThreads ? 0 : 1)} className={`w-full py-3 rounded-lg font-bold flex items-center justify-center gap-2 transition-all ${log.researchThreads ? 'bg-indigo-500 text-white' : 'bg-slate-800 text-slate-300 border border-slate-700'}`}>
                                            <BookOpen className="w-4 h-4"/> {log.researchThreads ? "Thread Published" : "Publish Thread"}
                                        </button>
                                    )}
                                    {reqs.reg > 0 && (
                                        <button onClick={() => handleUpdate('regularPosts', log.regularPosts ? 0 : 1)} className={`w-full py-3 rounded-lg font-bold flex items-center justify-center gap-2 transition-all ${log.regularPosts ? 'bg-blue-500 text-white' : 'bg-slate-800 text-slate-300 border border-slate-700'}`}>
                                            <Share2 className="w-4 h-4"/> {log.regularPosts ? "Post Published" : "Publish Update"}
                                        </button>
                                    )}
                                    {reqs.tracker && (
                                        <button onClick={() => handleUpdate('weeklyTracker', !log.weeklyTracker)} className={`w-full py-3 rounded-lg font-bold flex items-center justify-center gap-2 transition-all ${log.weeklyTracker ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 border border-slate-700'}`}>
                                            <CheckSquare className="w-4 h-4"/> {log.weeklyTracker ? "Tracker Updated" : "Update Weekly Tracker"}
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Grinding Section - Charisma Base */}
                        <div className="grid gap-3">
                            <NumberInput label="Reply Guy" value={log.replyGuy} target={TARGETS.replyGuy} onChange={(v) => handleUpdate('replyGuy', v)} icon={MessageSquare}/>
                            <NumberInput label="ICP Comments" value={log.icpComments} target={TARGETS.icpComments} onChange={(v) => handleUpdate('icpComments', v)} icon={Target}/>
                            <NumberInput label="HV Interactions" value={log.hvInteractions} target={TARGETS.hvInteractions} onChange={(v) => handleUpdate('hvInteractions', v)} icon={Share2}/>
                            <NumberInput label="Outbound DMs" value={log.outboundDMs} target={TARGETS.outboundDMs} onChange={(v) => handleUpdate('outboundDMs', v)} icon={Send}/>
                        </div>
                    </div>
                );
            };

            const renderStats = () => {
                const maxStat = Math.max(
                    skillStats.Charisma, 
                    skillStats.Intellect, 
                    skillStats.Fitness, 
                    skillStats.Creativity, 
                    skillStats.WorkEthic,
                    100
                );
                
                const normalizedStats = {
                    Charisma: (skillStats.Charisma / maxStat) * 100,
                    Intellect: (skillStats.Intellect / maxStat) * 100,
                    Fitness: (skillStats.Fitness / maxStat) * 100,
                    Creativity: (skillStats.Creativity / maxStat) * 100,
                    WorkEthic: (skillStats.WorkEthic / maxStat) * 100
                };

                return (
                    <div className="space-y-6 pb-20 animate-in fade-in slide-in-from-right-8 duration-500">
                        <div className="glass-panel p-6 rounded-2xl flex flex-col items-center text-center relative overflow-hidden">
                            <div className="w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center mb-3 shadow-lg shadow-indigo-500/20 z-10">
                                <User className="w-10 h-10 text-white" />
                            </div>
                            <h2 className="text-xl font-bold text-white z-10">Level {userLevel}</h2>
                            <p className="text-indigo-300 font-medium text-sm mb-4 z-10">Digital Athlete</p>
                            <div className="w-full max-w-xs z-10">
                                <div className="flex justify-between text-xs text-slate-400 mb-1">
                                    <span>XP: {totalXP}</span>
                                    <span>Next: {(userLevel * 3000)}</span>
                                </div>
                                <ProgressBar current={totalXP % 3000} max={3000} color="bg-gradient-to-r from-indigo-500 to-purple-500" />
                            </div>
                        </div>

                        <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 flex flex-col items-center">
                            <h3 className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">PENTAGON STATS</h3>
                            <SvgRadarChart stats={normalizedStats} />
                        </div>
                    </div>
                );
            };

            const renderData = () => (
                <div className="space-y-6 animate-in fade-in duration-500">
                    <div className="flex justify-between items-center">
                        <h2 className="text-xl font-bold text-white">Log History</h2>
                        <button onClick={() => {
                            const csvContent = "data:text/csv;charset=utf-8," + "Date,XP,Cardio\n" + history.map(h => `${h.date},${h.xp},${h.cardioMinutes}`).join("\n");
                            const link = document.createElement("a");
                            link.setAttribute("href", encodeURI(csvContent));
                            link.setAttribute("download", "daily_quests_log.csv");
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                        }} className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                            <Download className="w-4 h-4" /> Export
                        </button>
                    </div>
                    <div className="bg-slate-800 rounded-xl overflow-hidden border border-slate-700">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left text-slate-400">
                                <thead className="text-xs text-slate-200 uppercase bg-slate-900/50">
                                    <tr>
                                        <th className="px-4 py-3">Date</th>
                                        <th className="px-4 py-3">XP</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {history.map((h) => (
                                        <tr key={h.date} className="border-b border-slate-700 hover:bg-slate-700/50">
                                            <td className="px-4 py-3 font-medium text-white">{h.date}</td>
                                            <td className="px-4 py-3 text-right font-bold text-indigo-400">{h.xp}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div className="pt-8 border-t border-slate-800 text-center">
                        <button onClick={() => {
                            if(confirm("Delete all data? Cannot be undone.")) {
                                localStorage.removeItem(STORAGE_KEY);
                                window.location.reload();
                            }
                        }} className="text-red-500 text-xs flex items-center justify-center gap-2 mx-auto hover:text-red-400">
                            <Trash2 className="w-3 h-3" /> Reset Save Data
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-950 text-slate-200 font-sans selection:bg-indigo-500/30">
                    <div className="max-w-md mx-auto p-4">
                        <div className="flex flex-col mb-6 gap-4">
                            <div className="flex items-center justify-between">
                                <h1 className="text-xl font-black text-white tracking-tight flex items-center gap-2">
                                    <Scroll className="w-6 h-6 text-indigo-500" /> Daily Quests <span className="text-slate-600 text-xs font-normal">v5.3</span>
                                </h1>
                                <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-800">
                                    <button onClick={() => setActiveTab('quest')} className={`p-2 rounded-md transition-colors ${activeTab === 'quest' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}><Sword className="w-4 h-4" /></button>
                                    <button onClick={() => setActiveTab('stats')} className={`p-2 rounded-md transition-colors ${activeTab === 'stats' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}><User className="w-4 h-4" /></button>
                                    <button onClick={() => setActiveTab('data')} className={`p-2 rounded-md transition-colors ${activeTab === 'data' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}><Save className="w-4 h-4" /></button>
                                </div>
                            </div>
                        </div>
                        {activeTab === 'quest' && renderQuestLog()}
                        {activeTab === 'stats' && renderStats()}
                        {activeTab === 'data' && renderData()}
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<DailyQuestTracker />);
    </script>
</body>
</html>
