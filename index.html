<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Quest Tracker - RPG Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map to handle module imports -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0"
        }
    }
    </script>

    <!-- Fonts: Press Start 2P (Headers) and VT323 (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        pixel: ['"Press Start 2P"', 'cursive'],
                        retro: ['"VT323"', 'monospace'],
                    },
                    colors: {
                        rpg: {
                            bg: '#202028',
                            panel: '#f8f8f8',
                            red: '#d32f2f',
                            blue: '#1976d2',
                            green: '#388e3c',
                            yellow: '#fbc02d',
                            dark: '#1a1a1a',
                        }
                    },
                    boxShadow: {
                        'pixel': '4px 4px 0px 0px rgba(0,0,0,1)',
                        'pixel-sm': '2px 2px 0px 0px rgba(0,0,0,1)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #202028;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Custom Scrollbar for Retro Feel */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #202028; 
        }
        ::-webkit-scrollbar-thumb {
            background: #d32f2f; 
            border: 2px solid #202028;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #fbc02d; 
        }

        /* Scanline effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="text-slate-900">
    <div class="scanlines"></div>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Sword, Shield, Scroll, Trophy, Save, Calendar, BarChart2, Target, User, Zap, 
            MessageSquare, Share2, Send, PenTool, Download, ChevronLeft, ChevronRight, 
            Flame, Trash2, Crown, TrendingUp, Lock, CheckCircle, Heart, Video, Users, 
            BookOpen, Palette, Briefcase, CheckSquare, Dumbbell, History, ChevronDown, ChevronUp,
            Activity, Upload, Gamepad2, Settings, X, Plus, Minus, Edit3, Trash
        } from 'lucide-react';

        // --- Constants ---
        const STORAGE_KEY = 'daily_quests_v5_local';
        const ACTION_KEY = 'daily_quests_v5_actions';
        const SCHEDULE_KEY = 'daily_quests_v5_schedule';

        const getLocalDate = () => {
            const d = new Date();
            const offset = d.getTimezoneOffset() * 60000;
            return new Date(d.getTime() - offset).toISOString().split('T')[0];
        };

        const STAT_TYPES = ['Creativity', 'Intellect', 'WorkEthic', 'Charisma', 'Fitness'];

        // Initial default schedule - defines the TEMPLATE for tasks
        const DEFAULT_SCHEDULE = [

            { day: 0, title: "Monday", desc: "Start Strong", tasks: [
               { id: 't1', label: 'Post on X', target: 1, stat: 'Intellect', xp: 300 },
                { id: 't2', label: 'Publish Short', target: 1, stat: 'Creativity', xp: 200 }
            ]},
            { day: 1, title: "Tuesday", desc: "Deep Work", tasks: [
                { id: 't1', label: 'Post on X', target: 1, stat: 'Intellect', xp: 300 },
            ]},
            { day: 2, title: "Wednesday", desc: "Mid-week Push", tasks: [
                { id: 't1', label: 'Post on X', target: 1, stat: 'Intellect', xp: 300 },
                { id: 't2', label: 'Publish Short', target: 1, stat: 'Creativity', xp: 200 }            ]
            },
            { day: 3, title: "Thursday", desc: "Keep Going", tasks: [
                { id: 't1', label: 'Post on X', target: 1, stat: 'Intellect', xp: 300 },
            ]},
            { day: 4, title: "Friday", desc: "Finish Strong", tasks: [
                { id: 't1', label: 'Post on X', target: 1, stat: 'Intellect', xp: 300 },
                { id: 't2', label: 'Publish Short', target: 1, stat: 'Creativity', xp: 200 },
                { id: 't3', label: 'Tracker', target: 1, stat: 'WorkEthic', xp: 250 }
            ]},
            { day: 5, title: "Saturday", desc: "Rest and Recover", tasks: []},
             { day: 6, title: "Sunday", desc: "Rest and Recover", tasks: []},
        ];

        const INITIAL_LOG = {
            date: getLocalDate(),
            // Grind List
            replyGuy: 0,
            icpComments: 0,
            hvInteractions: 0,
            outboundDMs: 0,
            // Vitality
            cardioMinutes: 0,
            stretchingMinutes: 0, 
            // Boss (Now dynamic)
            bossTasks: [], // Array of { label, target, value, stat, xp }
            xp: 0,
        };

        const TARGETS = {
            replyGuy: 13,
            icpComments: 3,
            hvInteractions: 3,
            outboundDMs: 2,
            cardioMinutes: 30,
            stretchingMinutes: 15, 
        };

        const XP_VALUES = {
            replyGuy: 15,
            icpComments: 60,
            hvInteractions: 75,
            outboundDMs: 100,
            cardioMinutes: 10,
            stretchingMinutes: 10, 
            perfectDay: 500
        };

        // --- Retro Components ---

        const PixelCard = ({ children, color = "border-black", bgColor = "bg-rpg-panel", title, className = "" }) => (
            <div className={`relative border-4 ${color} ${bgColor} shadow-pixel p-4 mb-6 ${className}`}>
                {title && (
                    <div className={`absolute -top-4 left-4 ${color.replace('border', 'bg')} text-white px-2 py-1 font-pixel text-[10px] uppercase tracking-widest shadow-pixel-sm`}>
                        {title}
                    </div>
                )}
                {children}
            </div>
        );

        const PixelButton = ({ onClick, children, variant = "primary", className = "", fullWidth = false }) => {
            const variants = {
                primary: "bg-rpg-blue hover:bg-blue-600 text-white border-black",
                danger: "bg-rpg-red hover:bg-red-600 text-white border-black",
                success: "bg-rpg-green hover:bg-green-600 text-white border-black",
                warning: "bg-rpg-yellow hover:bg-yellow-400 text-black border-black",
                neutral: "bg-white hover:bg-gray-100 text-black border-black"
            };

            return (
                <button 
                    onClick={onClick}
                    className={`
                        ${variants[variant]} 
                        border-2 border-black 
                        shadow-pixel-sm active:translate-y-1 active:shadow-none transition-all
                        font-pixel text-[10px] py-3 px-4 uppercase
                        ${fullWidth ? 'w-full flex justify-center items-center' : ''}
                        ${className}
                    `}
                >
                    {children}
                </button>
            );
        };

        // --- Helper Components ---

        const ActionLog = ({ logs, clearLogs }) => {
            const [isOpen, setIsOpen] = useState(false);

            return (
                <div className="mt-8 border-t-4 border-black border-dashed pt-4">
                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className="flex items-center justify-between w-full font-pixel text-[10px] text-white hover:text-rpg-yellow uppercase mb-4"
                    >
                        <span className="flex items-center gap-2"><History className="w-4 h-4"/> System Log</span>
                        {isOpen ? <ChevronUp className="w-4 h-4"/> : <ChevronDown className="w-4 h-4"/>}
                    </button>
                    
                    {isOpen && (
                        <div className="bg-black border-2 border-rpg-green p-2 max-h-40 overflow-y-auto font-retro text-lg space-y-1 shadow-pixel">
                            {logs.length === 0 && <span className="text-rpg-green opacity-50">_No data found...</span>}
                            {logs.map((entry, i) => (
                                <div key={i} className="text-rpg-green border-b border-green-900/30 pb-1 flex justify-between">
                                    <span>
                                        <span className="opacity-50 mr-2">[{entry.time}]</span>
                                        {entry.msg}
                                    </span>
                                    <span className={entry.xp > 0 ? "text-yellow-400" : "text-red-400"}>
                                        {entry.xp > 0 ? '+' : ''}{entry.xp}XP
                                    </span>
                                </div>
                            ))}
                            {logs.length > 0 && (
                                <button 
                                    onClick={clearLogs}
                                    className="w-full text-center font-pixel text-[8px] text-red-500 hover:text-red-400 mt-2 pt-2 border-t border-green-900/50 uppercase"
                                >
                                    [ Clear Memory ]
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const SvgRadarChart = ({ stats }) => {
            const size = 220;
            const center = size / 2;
            const radius = 80;
            const labels = ["CHAR", "INT", "VIT", "CRE", "WORK"];
            const keys = ["Charisma", "Intellect", "Fitness", "Creativity", "WorkEthic"];

            const getCoordinates = (value, index, total) => {
                const angle = (Math.PI * 2 * index) / total - Math.PI / 2;
                const r = (value / 100) * radius;
                return `${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`;
            };

            const points = keys.map((key, i) => getCoordinates(stats[key], i, 5)).join(' ');
            const bgPoints = keys.map((_, i) => getCoordinates(100, i, 5)).join(' ');
            
            const labelCoords = keys.map((_, i) => {
                const angle = (Math.PI * 2 * i) / 5 - Math.PI / 2;
                const r = radius + 25;
                return {
                    x: center + r * Math.cos(angle),
                    y: center + r * Math.sin(angle)
                };
            });

            return (
                <svg width="100%" height="250" viewBox={`0 0 ${size} ${size}`} className="font-pixel text-[8px]">
                    <polygon points={bgPoints} fill="#1a1a1a" stroke="#4a4a4a" strokeWidth="2" />
                    
                    {[20, 40, 60, 80].map(r => (
                        <polygon 
                            key={r}
                            points={keys.map((_, i) => getCoordinates(r, i, 5)).join(' ')} 
                            fill="none" 
                            stroke="#333" 
                            strokeWidth="1" 
                            strokeDasharray="2 2"
                        />
                    ))}

                    {keys.map((_, i) => {
                        const end = getCoordinates(100, i, 5).split(',');
                        return <line key={i} x1={center} y1={center} x2={end[0]} y2={end[1]} stroke="#333" strokeWidth="1" />;
                    })}

                    {labelCoords.map((coord, i) => (
                        <text 
                            key={i} 
                            x={coord.x} 
                            y={coord.y} 
                            textAnchor="middle" 
                            dominantBaseline="middle" 
                            fill="#fbc02d"
                            className="font-pixel font-bold"
                        >
                            {labels[i]}
                        </text>
                    ))}

                    <polygon points={points} fill="rgba(25, 118, 210, 0.6)" stroke="#42a5f5" strokeWidth="2" />
                    
                    {keys.map((key, i) => {
                         const coords = getCoordinates(stats[key], i, 5).split(',');
                         return <rect key={i} x={coords[0]-2} y={coords[1]-2} width="4" height="4" fill="#fbc02d" />
                    })}
                </svg>
            );
        };

        const ProgressBar = ({ current, max, color = "bg-blue-500", size = "h-4" }) => {
            const percent = Math.min(100, (current / max) * 100);
            return (
                <div className={`w-full bg-black border-2 border-black ${size} relative`}>
                    <div 
                        className={`h-full ${color}`} 
                        style={{ width: `${percent}%` }} 
                    />
                    <div className="absolute inset-0 bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36zwjjgzjwqgABJCA5kAQyx5EBAQAM0Qv5e1J1oQAAAABJRU5ErkJggg==')] opacity-20 pointer-events-none"></div>
                </div>
            );
        };

        const NumberInput = ({ label, value, onChange, target, icon: Icon, step = 1 }) => {
            const isComplete = value >= target;
            return (
                <div className={`p-2 border-2 transition-all duration-300 ${isComplete ? 'bg-green-100 border-rpg-green' : 'bg-white border-black'} shadow-pixel-sm mb-2`}>
                    <div className="flex justify-between items-center mb-2">
                        <div className="flex items-center space-x-2">
                            <div className={`p-1 border-2 border-black ${isComplete ? 'bg-rpg-green text-white' : 'bg-rpg-blue text-white'}`}>
                                <Icon className="w-4 h-4" strokeWidth={2.5} />
                            </div>
                            <span className="font-pixel text-[10px] text-black uppercase">{label}</span>
                        </div>
                        <div className="text-xl font-retro text-black font-bold">
                            <span className={isComplete ? 'text-rpg-green' : ''}>{value}</span>
                            <span className="text-gray-400">/{target}</span>
                        </div>
                    </div>
                    <ProgressBar current={value} max={target} color={isComplete ? "bg-rpg-green" : "bg-rpg-blue"} />
                    <div className="flex space-x-2 mt-3 font-pixel text-[12px]">
                        <button onClick={() => onChange(Math.max(0, value - step))} className="w-8 h-8 flex items-center justify-center bg-gray-200 border-2 border-black hover:bg-gray-300 active:translate-y-1 active:shadow-none shadow-pixel-sm text-black">-</button>
                        <button onClick={() => onChange(value + step)} className={`flex-1 h-8 flex items-center justify-center border-2 border-black active:translate-y-1 active:shadow-none shadow-pixel-sm text-white uppercase ${isComplete ? 'bg-rpg-green hover:bg-green-600' : 'bg-rpg-blue hover:bg-blue-600'}`}>+ LOG</button>
                    </div>
                </div>
            );
        };

        const ScheduleBuilder = ({ isOpen, onClose, schedule, onUpdate }) => {
            const [selectedDay, setSelectedDay] = useState(0); 
            const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
            
            // Get current day's config or default
            const currentConfig = schedule.find(s => s.day === selectedDay) || { ...DEFAULT_SCHEDULE[0], day: selectedDay, tasks: [] };

            const handleHeaderChange = (field, value) => {
                const newSchedule = schedule.map(day => 
                    day.day === selectedDay ? { ...day, [field]: value } : day
                );
                onUpdate(newSchedule);
            };

            const updateTask = (index, field, value) => {
                const newTasks = [...currentConfig.tasks];
                newTasks[index] = { ...newTasks[index], [field]: value };
                handleHeaderChange('tasks', newTasks);
            };

            const addTask = () => {
                if (currentConfig.tasks.length >= 5) return;
                const newTask = { id: `t${Date.now()}`, label: 'New Task', target: 1, stat: 'WorkEthic', xp: 100 };
                handleHeaderChange('tasks', [...currentConfig.tasks, newTask]);
            };

            const removeTask = (index) => {
                const newTasks = currentConfig.tasks.filter((_, i) => i !== index);
                handleHeaderChange('tasks', newTasks);
            };

            return (
                <div className={`fixed inset-0 z-50 transform transition-transform duration-300 ${isOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="absolute right-0 top-0 h-full w-full max-w-sm bg-rpg-dark border-l-4 border-white shadow-2xl overflow-y-auto">
                        <div className="p-4 space-y-6">
                            {/* Header */}
                            <div className="flex justify-between items-center border-b-4 border-rpg-blue pb-4 mb-4">
                                <h2 className="text-white font-pixel text-sm flex items-center gap-2">
                                    <Settings className="w-4 h-4 text-rpg-yellow"/> BOSS CONFIG
                                </h2>
                                <button onClick={onClose} className="text-white hover:text-red-500">
                                    <X className="w-6 h-6" />
                                </button>
                            </div>

                            {/* Day Selector */}
                            <div className="grid grid-cols-7 gap-1 mb-4">
                                {days.map((d, i) => (
                                    <button 
                                        key={d}
                                        onClick={() => setSelectedDay(i)}
                                        className={`p-1 text-[8px] font-pixel border-2 border-black ${selectedDay === i ? 'bg-rpg-yellow text-black' : 'bg-gray-700 text-gray-400'}`}
                                    >
                                        {d[0]}
                                    </button>
                                ))}
                            </div>

                            {/* Config Form */}
                            <div className="bg-rpg-panel border-4 border-black p-4 space-y-4">
                                <div className="text-center font-pixel text-xs mb-2 text-rpg-blue underline">
                                    {days[selectedDay]} SETTINGS
                                </div>
                                
                                <input type="text" value={currentConfig.title} onChange={(e) => handleHeaderChange('title', e.target.value)} className="w-full bg-white border-2 border-black p-2 font-retro text-lg mb-2" placeholder="Title"/>
                                <input type="text" value={currentConfig.desc} onChange={(e) => handleHeaderChange('desc', e.target.value)} className="w-full bg-white border-2 border-black p-2 font-retro text-lg mb-4" placeholder="Description"/>

                                {/* Task List */}
                                <div className="space-y-4">
                                    {currentConfig.tasks.map((task, idx) => (
                                        <div key={idx} className="bg-white p-3 border-2 border-gray-300 relative">
                                            <button onClick={() => removeTask(idx)} className="absolute top-1 right-1 text-red-500 hover:text-red-700"><Trash className="w-3 h-3"/></button>
                                            <div className="grid grid-cols-2 gap-2 mb-2">
                                                <div>
                                                    <label className="font-pixel text-[6px] text-gray-500">LABEL</label>
                                                    <input type="text" value={task.label} onChange={(e) => updateTask(idx, 'label', e.target.value)} className="w-full border border-black px-1 font-retro text-sm"/>
                                                </div>
                                                <div>
                                                    <label className="font-pixel text-[6px] text-gray-500">STAT TYPE</label>
                                                    <select value={task.stat} onChange={(e) => updateTask(idx, 'stat', e.target.value)} className="w-full border border-black px-1 font-retro text-sm h-6 bg-white">
                                                        {STAT_TYPES.map(s => <option key={s} value={s}>{s}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div className="flex items-center gap-2">
                                                    <label className="font-pixel text-[6px] text-gray-500">TARGET</label>
                                                    <input type="number" min="1" max="10" value={task.target} onChange={(e) => updateTask(idx, 'target', parseInt(e.target.value))} className="w-12 border border-black px-1 font-retro text-sm"/>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <label className="font-pixel text-[6px] text-gray-500">XP</label>
                                                    <input type="number" step="50" value={task.xp} onChange={(e) => updateTask(idx, 'xp', parseInt(e.target.value))} className="w-16 border border-black px-1 font-retro text-sm"/>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    {currentConfig.tasks.length < 5 && (
                                        <button onClick={addTask} className="w-full border-2 border-dashed border-gray-400 p-2 font-pixel text-[8px] text-gray-500 hover:bg-gray-100 hover:text-black">
                                            + ADD TASK
                                        </button>
                                    )}
                                </div>
                            </div>
                            <div className="text-center text-gray-400 text-[10px] font-pixel">Changes auto-save. Syncs to today immediately.</div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        function DailyQuestTracker() {
            const [activeTab, setActiveTab] = useState('quest');
            const [currentDate, setCurrentDate] = useState(getLocalDate());
            const [log, setLog] = useState(INITIAL_LOG);
            const [history, setHistory] = useState([]);
            const [actionHistory, setActionHistory] = useState([]);
            const [bossSchedule, setBossSchedule] = useState(DEFAULT_SCHEDULE);
            const [isScheduleOpen, setIsScheduleOpen] = useState(false);
            const fileInputRef = useRef(null);

            // Load Data
            useEffect(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsedHistory = JSON.parse(saved);
                        setHistory(parsedHistory);
                        // Init log with current date
                        const todayEntry = parsedHistory.find(h => h.date === currentDate);
                        if (todayEntry) {
                            // Ensure structure compatibility
                            if (!todayEntry.bossTasks) todayEntry.bossTasks = [];
                            setLog(todayEntry);
                        } else {
                            // New day? Get tasks from schedule
                            initializeDay(currentDate, JSON.parse(localStorage.getItem(SCHEDULE_KEY) || JSON.stringify(DEFAULT_SCHEDULE)));
                        }
                    }
                    const savedActions = localStorage.getItem(ACTION_KEY);
                    if (savedActions) setActionHistory(JSON.parse(savedActions));
                    
                    const savedSchedule = localStorage.getItem(SCHEDULE_KEY);
                    if (savedSchedule) setBossSchedule(JSON.parse(savedSchedule));
                } catch (e) { console.error("Load failed", e); }
            }, []);

            // When schedule changes, try to update TODAY if it exists, or just state
            const updateSchedule = (newSchedule) => {
                setBossSchedule(newSchedule);
                localStorage.setItem(SCHEDULE_KEY, JSON.stringify(newSchedule));
                
                // Live update if looking at today
                if (log.date === getLocalDate()) {
                    initializeDay(log.date, newSchedule, true); 
                }
            };

            // Helper to set up a day's log based on schedule
            const initializeDay = (dateStr, scheduleData, preserveValues = false) => {
                const dayIndex = new Date(dateStr).getDay();
                const config = scheduleData.find(s => s.day === dayIndex) || DEFAULT_SCHEDULE[0];
                
                // Map config tasks to log structure
                // If preserving (editing schedule mid-day), try to keep 'value'
                const newBossTasks = config.tasks.map(t => {
                    const existing = preserveValues ? log.bossTasks?.find(bt => bt.id === t.id || bt.label === t.label) : null;
                    return {
                        ...t,
                        value: existing ? existing.value : 0 // Keep progress if exists
                    };
                });

                const newLog = {
                    ...INITIAL_LOG,
                    ...log, // Keep other props
                    date: dateStr,
                    bossTasks: newBossTasks
                };
                setLog(newLog);
            };

            // Sync Log on Date Change
            useEffect(() => {
                const entry = history.find(h => h.date === currentDate);
                if (entry) {
                    setLog(entry);
                } else {
                    initializeDay(currentDate, bossSchedule);
                }
            }, [currentDate]);

            const saveToLocal = (newLog) => {
                const otherEntries = history.filter(h => h.date !== newLog.date);
                const newHistory = [...otherEntries, newLog].sort((a, b) => b.date.localeCompare(a.date));
                setHistory(newHistory);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(newHistory));
            };

            // Unified Update Handler
            const handleUpdate = (field, val, taskIndex = null) => {
                let diff = 0;
                let taskLabel = "";
                let xpChange = 0;
                
                const updatedLog = { ...log };

                if (field === 'bossTask') {
                    // Updating a specific dynamic task
                    const task = updatedLog.bossTasks[taskIndex];
                    const oldVal = task.value;
                    diff = val - oldVal;
                    task.value = val;
                    taskLabel = task.label;
                    xpChange = diff * (task.xp || 0);
                } else {
                    // Updating static fields
                    const oldVal = log[field] || 0;
                    diff = val - oldVal;
                    updatedLog[field] = val;
                    taskLabel = field;
                    xpChange = diff * (XP_VALUES[field] || 0);
                }

                if (diff !== 0) {
                    const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const msg = `${taskLabel}: ${diff > 0 ? '+' : ''}${diff}`;
                    const newLogEntry = { time: timestamp, msg: msg, xp: xpChange };
                    const updatedActionLog = [newLogEntry, ...actionHistory].slice(0, 50);
                    setActionHistory(updatedActionLog);
                    localStorage.setItem(ACTION_KEY, JSON.stringify(updatedActionLog));
                }

                // Recalculate Total XP
                let newXp = (updatedLog.replyGuy * XP_VALUES.replyGuy) +
                            (updatedLog.icpComments * XP_VALUES.icpComments) +
                            (updatedLog.hvInteractions * XP_VALUES.hvInteractions) +
                            (updatedLog.outboundDMs * XP_VALUES.outboundDMs) +
                            (updatedLog.cardioMinutes * XP_VALUES.cardioMinutes) +
                            ((updatedLog.stretchingMinutes || 0) * XP_VALUES.stretchingMinutes);
                
                // Add Dynamic Boss XP
                if (updatedLog.bossTasks) {
                    updatedLog.bossTasks.forEach(t => {
                        newXp += (t.value * (t.xp || 0));
                    });
                }

                updatedLog.xp = newXp;
                setLog(updatedLog);
                saveToLocal(updatedLog);
            };

            const clearActionLogs = () => {
                setActionHistory([]);
                localStorage.removeItem(ACTION_KEY);
            };

            // Dynamic CSV Export
            const handleExport = () => {
                // Base headers
                let csv = "Date,Total XP,Reply Guy,ICP Comments,HV Interact,Outbound DMs,Cardio,Stretching";
                
                // Find max number of boss tasks in history to create enough columns
                const maxTasks = history.reduce((max, h) => Math.max(max, (h.bossTasks?.length || 0)), 0);
                for(let i=0; i<maxTasks; i++) {
                    csv += `,Task ${i+1} Label,Task ${i+1} Value,Task ${i+1} XP`;
                }
                csv += "\n";

                history.forEach(h => {
                    let row = `${h.date},${h.xp},${h.replyGuy},${h.icpComments},${h.hvInteractions},${h.outboundDMs},${h.cardioMinutes},${h.stretchingMinutes}`;
                    
                    // Add dynamic tasks
                    const tasks = h.bossTasks || [];
                    for(let i=0; i<maxTasks; i++) {
                        if (tasks[i]) {
                            row += `,${tasks[i].label},${tasks[i].value},${tasks[i].xp}`;
                        } else {
                            row += ",,,"; // Empty columns if this day had fewer tasks
                        }
                    }
                    csv += row + "\n";
                });

                const link = document.createElement("a");
                link.setAttribute("href", encodeURI("data:text/csv;charset=utf-8," + csv));
                link.setAttribute("download", `quest_log_backup_${getLocalDate()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        // Basic import logic - strictly replaces history if valid JSON or parses CSV (simplified for now to JSON restore as CSV is complex with dynamic columns)
                        // For reliability with the new dynamic structure, let's just alert
                        alert("Import for new dynamic structure is complex. Please rely on local storage or implement advanced JSON import.");
                    } catch (err) { alert("Error: " + err.message); }
                };
                reader.readAsText(file);
                e.target.value = ''; 
            };

            // Stats Logic Updated for Dynamic Tasks
            const skillStats = useMemo(() => {
                const stats = { Charisma: 0, Intellect: 0, Fitness: 0, Creativity: 0, WorkEthic: 0 };
                history.forEach(day => {
                    // Base grind
                    stats.Charisma += (day.replyGuy * 10) + (day.icpComments * 20) + (day.hvInteractions * 30) + (day.outboundDMs * 40);
                    stats.Fitness += (day.cardioMinutes * 5) + ((day.stretchingMinutes || 0) * 5);
                    
                    // Dynamic Boss Tasks Mapping
                    if (day.bossTasks) {
                        day.bossTasks.forEach(t => {
                            if (t.value > 0) {
                                // Add XP * multiplier to stat, or just flat value? Let's assume 1 task point = relevant stat points
                                // Or use the XP value as a proxy for effort
                                const statName = t.stat || 'WorkEthic';
                                if (stats[statName] !== undefined) {
                                    stats[statName] += (t.value * 100); // 1 task = 100 stat points roughly
                                }
                            }
                        });
                    }
                });
                return stats;
            }, [history]);

            const totalYT = useMemo(() => history.reduce((acc, curr) => {
                let count = curr.ytShorts || 0; // Legacy
                if (curr.bossTasks) {
                    curr.bossTasks.forEach(t => {
                        if (t.label.toLowerCase().includes('short')) count += t.value;
                    });
                }
                return acc + count;
            }, 0), [history]);

            const streaks = useMemo(() => {
                if (history.length === 0) return { omni: 0, fitness: 0 };
                // Simplified streak logic for demo
                // A day is "perfect" if all boss tasks for that day are met
                return { omni: history.length, fitness: history.filter(h => h.cardioMinutes > 0).length };
            }, [history]);

            const userLevel = Math.floor(log.xp / 3000) + 1; // Live XP

            // --- Renderers ---

            const renderQuestLog = () => {
                // Get config for Title/Desc only (tasks come from Log now to preserve history)
                const dayConfig = bossSchedule.find(s => s.day === new Date(currentDate).getDay()) || DEFAULT_SCHEDULE[0];

                return (
                    <div className="space-y-6 pb-20 animate-in fade-in slide-in-from-bottom-4 duration-500">
                        {/* Header Controls */}
                        <div className="flex items-center justify-between bg-black border-2 border-white p-2 shadow-pixel">
                            <button onClick={() => {
                                const d = new Date(currentDate);
                                d.setDate(d.getDate() - 1);
                                setCurrentDate(d.toISOString().split('T')[0]);
                            }} className="p-2 text-white hover:text-rpg-yellow"><ChevronLeft className="w-6 h-6"/></button>
                            <div className="text-center">
                                <div className="text-[10px] text-rpg-blue font-pixel mb-1">QUEST DATE</div>
                                <div className="font-retro text-3xl text-white flex items-center justify-center gap-2">{currentDate}</div>
                            </div>
                            <button onClick={() => {
                                const d = new Date(currentDate);
                                d.setDate(d.getDate() + 1);
                                setCurrentDate(d.toISOString().split('T')[0]);
                            }} className="p-2 text-white hover:text-rpg-yellow"><ChevronRight className="w-6 h-6"/></button>
                        </div>

                         {/* Streaks Banner */}
                         <div className="grid grid-cols-3 gap-2">
                            <div className="bg-rpg-blue border-2 border-black p-2 text-center shadow-pixel-sm">
                                <div className="font-pixel text-[8px] text-white mb-1">Work</div>
                                <div className="font-retro text-2xl text-white font-bold">{streaks.omni} <span className="text-sm">Days</span></div>
                            </div>
                            <div className="bg-rpg-red border-2 border-black p-2 text-center shadow-pixel-sm">
                                <div className="font-pixel text-[8px] text-white mb-1">Health</div>
                                <div className="font-retro text-2xl text-white font-bold">{streaks.fitness} <span className="text-sm">Days</span></div>
                            </div>
                            <div className="bg-rpg-yellow border-2 border-black p-2 text-center shadow-pixel-sm">
                                <div className="font-pixel text-[8px] text-black mb-1">Video</div>
                                <div className="font-retro text-black text-2xl font-bold">{totalYT} <span className="text-sm">Vids</span></div>
                            </div>
                        </div>

                        {/* Vitality Section */}
                        <PixelCard title="Vitality" color="border-rpg-green" bgColor="bg-green-50">
                            <div className="mt-2">
                                <NumberInput label="Cardio (Mins)" value={log.cardioMinutes} target={TARGETS.cardioMinutes} step={5} onChange={(v) => handleUpdate('cardioMinutes', v)} icon={Heart}/>
                                <NumberInput label="Stretching (Mins)" value={log.stretchingMinutes || 0} target={TARGETS.stretchingMinutes} step={5} onChange={(v) => handleUpdate('stretchingMinutes', v)} icon={Activity}/>
                            </div>
                        </PixelCard>

                        {/* Boss Section (Dynamic) */}
                        <PixelCard title={dayConfig.title} color="border-rpg-red" bgColor="bg-red-50">
                            <div className="absolute top-2 right-2">
                                <button onClick={() => setIsScheduleOpen(true)} className="text-red-900/50 hover:text-red-600">
                                    <Edit3 className="w-4 h-4"/>
                                </button>
                            </div>
                            <p className="text-xs font-pixel text-rpg-red mb-3 text-center uppercase border-b-2 border-dashed border-red-200 pb-2">{dayConfig.desc}</p>
                            
                            <div className="space-y-3 mt-2">
                                {log.bossTasks && log.bossTasks.length > 0 ? (
                                    log.bossTasks.map((task, idx) => (
                                        <PixelButton 
                                            key={task.id || idx} 
                                            fullWidth 
                                            onClick={() => handleUpdate('bossTask', (task.value >= task.target ? 0 : task.value + 1), idx)} 
                                            variant={task.value >= task.target ? "success" : "neutral"}
                                        >
                                            <span className="flex items-center justify-between w-full px-2">
                                                <span className="flex items-center gap-2"><Sword className="w-4 h-4"/> {task.label}</span>
                                                <span>{task.value}/{task.target}</span>
                                            </span>
                                        </PixelButton>
                                    ))
                                ) : (
                                    <div className="text-center font-pixel text-[8px] text-gray-500 py-4">NO QUESTS CONFIGURED</div>
                                )}
                            </div>
                        </PixelCard>

                        {/* Grind List Section */}
                        <PixelCard title="Grind List" color="border-rpg-yellow" bgColor="bg-yellow-50">
                            <div className="mt-2">
                                <NumberInput label="Reply Guy" value={log.replyGuy} target={TARGETS.replyGuy} onChange={(v) => handleUpdate('replyGuy', v)} icon={MessageSquare}/>
                                <NumberInput label="ICP Comments" value={log.icpComments} target={TARGETS.icpComments} onChange={(v) => handleUpdate('icpComments', v)} icon={Target}/>
                                <NumberInput label="HV Interact" value={log.hvInteractions} target={TARGETS.hvInteractions} onChange={(v) => handleUpdate('hvInteractions', v)} icon={Share2}/>
                                <NumberInput label="Outbound DMs" value={log.outboundDMs} target={TARGETS.outboundDMs} onChange={(v) => handleUpdate('outboundDMs', v)} icon={Send}/>
                            </div>
                        </PixelCard>
                        
                        <ActionLog logs={actionHistory} clearLogs={clearActionLogs} />

                        <ScheduleBuilder 
                            isOpen={isScheduleOpen} 
                            onClose={() => setIsScheduleOpen(false)} 
                            schedule={bossSchedule} 
                            onUpdate={updateSchedule} 
                        />
                    </div>
                );
            };

            const renderStats = () => {
                // Normalize stats for chart
                const maxStat = Math.max(100, ...Object.values(skillStats));
                const normalizedStats = {};
                Object.keys(skillStats).forEach(key => {
                    normalizedStats[key] = (skillStats[key] / maxStat) * 100;
                });

                return (
                    <div className="space-y-6 pb-20 animate-in fade-in slide-in-from-right-8 duration-500">
                        <PixelCard title="Player Card" color="border-rpg-blue" bgColor="bg-rpg-dark">
                            <div className="flex flex-col items-center text-center">
                                <div className="w-20 h-20 bg-rpg-blue border-4 border-white mb-3 shadow-pixel flex items-center justify-center">
                                    <User className="w-10 h-10 text-white" />
                                </div>
                                <h2 className="text-2xl font-pixel text-white mb-1">LVL {userLevel}</h2>
                                <p className="text-rpg-yellow font-retro text-xl uppercase mb-4">Digital Athlete</p>
                                
                                <div className="w-full">
                                    <div className="flex justify-between font-pixel text-[10px] text-white mb-1">
                                        <span>EXP</span>
                                        <span>{log.xp}</span>
                                    </div>
                                    <ProgressBar current={log.xp % 3000} max={3000} color="bg-gradient-to-r from-blue-500 to-purple-500" />
                                </div>
                            </div>
                        </PixelCard>

                        <PixelCard title="Stats Hex" color="border-white" bgColor="bg-rpg-dark">
                            <div className="flex justify-center p-4">
                                <SvgRadarChart stats={normalizedStats} />
                            </div>
                        </PixelCard>
                    </div>
                );
            };

            const renderData = () => (
                <div className="space-y-6 animate-in fade-in duration-500">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-pixel text-white">Save Data</h2>
                        <div className="flex gap-2">
                            <PixelButton onClick={handleExport} variant="primary">
                                <Download className="w-3 h-3 mr-2" /> Export CSV
                            </PixelButton>
                        </div>
                    </div>
                    
                    <div className="bg-black border-4 border-white shadow-pixel overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left font-retro text-xl">
                                <thead className="bg-rpg-blue text-white border-b-4 border-white">
                                    <tr><th className="px-4 py-2">DATE</th><th className="px-4 py-2 text-right">XP</th></tr>
                                </thead>
                                <tbody>
                                    {history.map((h) => (
                                        <tr key={h.date} className="border-b border-gray-800 text-white hover:bg-gray-900">
                                            <td className="px-4 py-2">{h.date}</td>
                                            <td className="px-4 py-2 text-right text-rpg-yellow">{h.xp}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="pt-8 text-center">
                        <PixelButton onClick={() => {
                            if(confirm("DELETE EVERYTHING?")) {
                                localStorage.clear();
                                window.location.reload();
                            }
                        }} variant="danger">
                            <Trash2 className="w-3 h-3 mr-2" /> ERASE DATA
                        </PixelButton>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-10">
                    <button 
                         onClick={() => setIsScheduleOpen(true)}
                         className="fixed right-0 top-20 bg-rpg-dark border-l-2 border-y-2 border-white p-2 z-40 rounded-l-lg hover:bg-gray-800 shadow-pixel"
                         title="Configure Schedule"
                    >
                        <Settings className="w-6 h-6 text-rpg-yellow animate-spin-slow" />
                    </button>

                    <div className="max-w-md mx-auto p-4">
                        <div className="mb-8 mt-4 text-center">
                            <h1 className="text-2xl font-pixel text-white text-shadow-pixel tracking-tighter leading-relaxed">
                                <span className="text-rpg-red">DAILY</span> <span className="text-rpg-blue">QUEST</span>
                            </h1>
                            <div className="text-rpg-yellow font-pixel text-[10px]">VER 5.6 [DYNAMIC]</div>
                        </div>

                        <div className="flex justify-center gap-2 mb-8 bg-black p-2 border-4 border-white shadow-pixel">
                            <button onClick={() => setActiveTab('quest')} className={`p-2 border-2 ${activeTab === 'quest' ? 'bg-rpg-red border-white text-white' : 'bg-gray-800 border-gray-600 text-gray-500'} hover:bg-rpg-red hover:text-white transition-colors`}>
                                <Sword className="w-5 h-5" />
                            </button>
                            <button onClick={() => setActiveTab('stats')} className={`p-2 border-2 ${activeTab === 'stats' ? 'bg-rpg-blue border-white text-white' : 'bg-gray-800 border-gray-600 text-gray-500'} hover:bg-rpg-blue hover:text-white transition-colors`}>
                                <User className="w-5 h-5" />
                            </button>
                            <button onClick={() => setActiveTab('data')} className={`p-2 border-2 ${activeTab === 'data' ? 'bg-rpg-green border-white text-white' : 'bg-gray-800 border-gray-600 text-gray-500'} hover:bg-rpg-green hover:text-white transition-colors`}>
                                <Save className="w-5 h-5" />
                            </button>
                        </div>
                        
                        {activeTab === 'quest' && renderQuestLog()}
                        {activeTab === 'stats' && renderStats()}
                        {activeTab === 'data' && renderData()}
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<DailyQuestTracker />);
    </script>
</body>
</html>
